# ============================================================================
# NL2SQL 메타데이터 조회 쿼리 (Oracle)
# ============================================================================
#
# Oracle 특화 사항:
#   - 스키마 = 사용자 (nl2sql 사용자)
#   - NUMBER(1)이 BOOLEAN 역할
#   - CLOB 타입 사용
#   - JSON 지원 (Oracle 12c+)
#   - NVL 함수로 DB별 조건 우선 적용
# ============================================================================

metadataSchema: NL2SQL

queries:
  # ==========================================================================
  # 테이블 관계 조회  # ==========================================================================
  relationships:
    sql: |
      SELECT
        source_schema,
        source_table,
        source_column,
        target_schema,
        target_table,
        target_column,
        relationship_type,
        confidence_level,
        join_hint,
        polymorphic_type_column,
        polymorphic_type_value,
        UTL_RAW.CAST_TO_RAW(description) as description
      FROM table_relationships
      WHERE is_active = 1
      ORDER BY source_schema, source_table, source_column
    mapping:
      sourceSchema: source_schema
      sourceTable: source_table
      sourceColumn: source_column
      targetSchema: target_schema
      targetTable: target_table
      targetColumn: target_column
      relationshipType: relationship_type
      confidence: confidence_level
      joinHint: join_hint

  # ==========================================================================
  # 네이밍 컨벤션 조회
  # ==========================================================================
  namingConventions:
    sql: |
      SELECT
        convention_name,
        column_pattern,
        target_table_pattern,
        target_column_pattern,
        table_prefix_strip,
        table_suffix_strip,
        apply_pluralization,
        priority,
        apply_to_schemas,
        exclude_tables,
        UTL_RAW.CAST_TO_RAW(description) as description
      FROM naming_conventions
      WHERE is_active = 1
      ORDER BY priority
    mapping:
      name: convention_name
      columnPattern: column_pattern
      targetTablePattern: target_table_pattern
      targetColumnPattern: target_column_pattern
      applyPluralization: apply_pluralization
      priority: priority

  # ==========================================================================
  # 공통코드 테이블 설정 조회
  # ==========================================================================
  codeTables:
    sql: |
      SELECT
        code_table_name,
        table_schema,
        table_name,
        group_code_column,
        code_column,
        code_name_column,
        description_column,
        sort_order_column,
        active_flag_column,
        active_flag_value,
        additional_filter,
        locale_column,
        default_locale
      FROM code_tables
      WHERE is_active = 1
    mapping:
      codeTableName: code_table_name
      tableSchema: table_schema
      tableName: table_name
      groupCodeColumn: group_code_column
      codeColumn: code_column
      codeNameColumn: code_name_column
      descriptionColumn: description_column
      sortOrderColumn: sort_order_column
      activeFlagColumn: active_flag_column
      activeFlagValue: active_flag_value
      additionalFilter: additional_filter

  # ==========================================================================
  # 컬럼-코드 매핑 조회
  # ==========================================================================
  columnCodeMappings:
    sql: |
      SELECT
        target_schema,
        target_table,
        target_column,
        code_table_name,
        group_code,
        UTL_RAW.CAST_TO_RAW(display_name) as display_name,
        include_in_prompt
      FROM column_code_mapping
      WHERE is_active = 1
      ORDER BY target_schema, target_table, target_column
    mapping:
      targetSchema: target_schema
      targetTable: target_table
      targetColumn: target_column
      codeTableName: code_table_name
      groupCode: group_code
      displayName: display_name
      includeInPrompt: include_in_prompt

  # ==========================================================================
  # 코드 별칭 조회
  # ==========================================================================
  codeAliases:
    sql: |
      SELECT
        code_table_name,
        group_code,
        code_value,
        UTL_RAW.CAST_TO_RAW(alias) as alias,
        locale
      FROM code_aliases
      WHERE is_active = 1
    mapping:
      codeTableName: code_table_name
      groupCode: group_code
      codeValue: code_value
      alias: alias
      locale: locale

  # ==========================================================================
  # 용어집 조회 (Oracle용 SQL 조건 우선)
  # ==========================================================================
  glossaryTerms:
    sql: |
      SELECT
        term_code,
        UTL_RAW.CAST_TO_RAW(term) as term,
        category,
        sql_condition,
        sql_condition_pg,
        sql_condition_mysql,
        apply_to_tables,
        required_columns,
        UTL_RAW.CAST_TO_RAW(definition) as definition,
        UTL_RAW.CAST_TO_RAW(example_usage) as example_usage,
        priority
      FROM glossary_terms
      WHERE is_active = 1
      ORDER BY priority
    mapping:
      termCode: term_code
      term: term
      category: category
      sqlCondition: sql_condition
      sqlConditionPg: sql_condition_pg
      sqlConditionMysql: sql_condition_mysql
      applyToTables: apply_to_tables
      requiredColumns: required_columns
      definition: definition
      exampleUsage: example_usage
      priority: priority

  # ==========================================================================
  # 용어 별칭 조회
  # ==========================================================================
  glossaryAliases:
    sql: |
      SELECT
        term_code,
        UTL_RAW.CAST_TO_RAW(alias) as alias,
        locale,
        match_type
      FROM glossary_aliases
      WHERE is_active = 1
    mapping:
      termCode: term_code
      alias: alias
      locale: locale
      matchType: match_type

  # ==========================================================================
  # 용어 컨텍스트 조회
  # ==========================================================================
  glossaryContexts:
    sql: |
      SELECT
        term_code,
        context_schema,
        context_table,
        sql_condition,
        sql_condition_pg,
        sql_condition_mysql,
        required_columns,
        UTL_RAW.CAST_TO_RAW(context_definition) as context_definition
      FROM glossary_contexts
      WHERE is_active = 1
    mapping:
      termCode: term_code
      contextSchema: context_schema
      contextTable: context_table
      sqlCondition: sql_condition
      requiredColumns: required_columns
      contextDefinition: context_definition

  # ==========================================================================
  # 쿼리 패턴 조회 (Oracle용 템플릿 우선)
  # ==========================================================================
  queryPatterns:
    sql: |
      SELECT
        pattern_code,
        pattern_name,
        category,
        sql_template,
        sql_template_pg,
        sql_template_mysql,
        applicable_tables,
        required_columns,
        required_joins,
        match_score_threshold,
        priority,
        UTL_RAW.CAST_TO_RAW(description) as description,
        UTL_RAW.CAST_TO_RAW(example_input) as example_input,
        UTL_RAW.CAST_TO_RAW(example_output) as example_output
      FROM query_patterns
      WHERE is_active = 1
      ORDER BY priority
    mapping:
      patternCode: pattern_code
      patternName: pattern_name
      category: category
      sqlTemplate: sql_template
      sqlTemplatePg: sql_template_pg
      sqlTemplateMysql: sql_template_mysql
      applicableTables: applicable_tables
      requiredColumns: required_columns
      requiredJoins: required_joins
      matchScoreThreshold: match_score_threshold
      priority: priority
      description: description
      exampleInput: example_input
      exampleOutput: example_output

  # ==========================================================================
  # 패턴 파라미터 조회
  # ==========================================================================
  patternParameters:
    sql: |
      SELECT
        pattern_code,
        param_name,
        param_type,
        is_required,
        default_value,
        allowed_values,
        infer_from_keywords,
        infer_from_column_type,
        UTL_RAW.CAST_TO_RAW(description) as description,
        display_order
      FROM pattern_parameters
      WHERE is_active = 1
      ORDER BY pattern_code, display_order
    mapping:
      patternCode: pattern_code
      paramName: param_name
      paramType: param_type
      isRequired: is_required
      defaultValue: default_value
      allowedValues: allowed_values
      inferFromKeywords: infer_from_keywords
      inferFromColumnType: infer_from_column_type
      description: description
      displayOrder: display_order

  # ==========================================================================
  # 패턴 키워드 조회
  # ==========================================================================
  patternKeywords:
    sql: |
      SELECT
        pattern_code,
        UTL_RAW.CAST_TO_RAW(keyword) as keyword,
        locale,
        weight,
        match_type,
        is_required
      FROM pattern_keywords
      WHERE is_active = 1
    mapping:
      patternCode: pattern_code
      keyword: keyword
      locale: locale
      weight: weight
      matchType: match_type
      isRequired: is_required

  # ==========================================================================
  # 추론용: 관계 UPSERT (MERGE INTO)
  # Oracle 한글 description은 {{DESCRIPTION_BIND}} 플레이스홀더로 처리
  # ==========================================================================
  inferenceUpsert:
    sql: |
      MERGE INTO table_relationships tr
      USING (
        SELECT ? AS source_schema, ? AS source_table, ? AS source_column,
               ? AS target_schema, ? AS target_table, ? AS target_column
        FROM DUAL
      ) src
      ON (
        tr.source_schema = src.source_schema
        AND tr.source_table = src.source_table
        AND tr.source_column = src.source_column
        AND tr.target_schema = src.target_schema
        AND tr.target_table = src.target_table
        AND tr.target_column = src.target_column
      )
      WHEN NOT MATCHED THEN
        INSERT (
          source_schema, source_table, source_column,
          target_schema, target_table, target_column,
          relationship_type, confidence_level, join_hint,
          description, is_active, created_by
        ) VALUES (
          src.source_schema, src.source_table, src.source_column,
          src.target_schema, src.target_table, src.target_column,
          ?, ?, ?, {{DESCRIPTION_BIND}}, ?, ?
        )
    mapping: {}

  # ==========================================================================
  # query_pattern_add: 쿼리 패턴 등록 (MERGE INTO)
  # ==========================================================================
  queryPatternInsert:
    sql: |
      MERGE INTO query_patterns tgt
      USING (SELECT ? AS pattern_code FROM DUAL) src
      ON (tgt.pattern_code = src.pattern_code)
      WHEN MATCHED THEN UPDATE SET
        pattern_name        = {{BIND_TEXT}},
        category            = ?,
        sql_template        = ?,
        sql_template_mysql  = ?,
        sql_template_oracle = ?,
        applicable_tables   = ?,
        description         = {{BIND_TEXT}},
        example_input       = {{BIND_TEXT}},
        updated_at          = SYSTIMESTAMP
      WHEN NOT MATCHED THEN INSERT (
        pattern_code, pattern_name, category,
        sql_template, sql_template_mysql, sql_template_oracle,
        applicable_tables, match_score_threshold, priority,
        description, example_input, is_active, created_by
      ) VALUES (?, {{BIND_TEXT}}, ?, ?, ?, ?, ?, ?, ?, {{BIND_TEXT}}, {{BIND_TEXT}}, 1, 'mcp_user')
    mapping: {}

  # ==========================================================================
  # query_pattern_add: 패턴 키워드 등록 (중복 무시)
  # ==========================================================================
  queryPatternKeywordInsert:
    sql: |
      MERGE INTO pattern_keywords tgt
      USING (SELECT ? AS pattern_code, {{BIND_TEXT}} AS keyword FROM DUAL) src
      ON (tgt.pattern_code = src.pattern_code AND tgt.keyword = src.keyword)
      WHEN NOT MATCHED THEN INSERT (
        pattern_code, keyword, locale, weight, match_type, is_required
      ) VALUES (?, {{BIND_TEXT}}, 'ko', 10, 'CONTAINS', 0)
    mapping: {}

  # ==========================================================================
  # query_pattern_search: 패턴명/설명 키워드 검색
  # ==========================================================================
  queryPatternSearch:
    sql: |
      SELECT qp.pattern_code, qp.pattern_name, qp.category,
             qp.sql_template, qp.description, qp.example_input,
             qp.applicable_tables,
             LISTAGG(pk.keyword, ',') WITHIN GROUP (ORDER BY pk.keyword) AS keywords
      FROM query_patterns qp
      LEFT JOIN pattern_keywords pk
             ON pk.pattern_code = qp.pattern_code AND pk.is_active = 1
      WHERE qp.is_active = 1
        AND (UPPER(qp.pattern_name) LIKE UPPER(?) OR UPPER(qp.description) LIKE UPPER(?))
      GROUP BY qp.pattern_code, qp.pattern_name, qp.category,
               qp.sql_template, qp.description, qp.example_input, qp.applicable_tables
      ORDER BY qp.priority
      FETCH FIRST ? ROWS ONLY
    mapping: {}

  # ==========================================================================
  # query_history_*: 쿼리 이력 관리
  # ==========================================================================
  queryHistoryUpsert:
    sql: |
      MERGE INTO query_history tgt
      USING (SELECT ? AS query_hash FROM DUAL) src
      ON (tgt.query_hash = src.query_hash)
      WHEN MATCHED THEN UPDATE SET
        usage_count   = tgt.usage_count + 1,
        last_used_at  = SYSTIMESTAMP,
        generated_sql = ?,
        executed      = GREATEST(tgt.executed, ?)
      WHEN NOT MATCHED THEN INSERT (
        query_hash, natural_query, generated_sql, connection_id, executed
      ) VALUES (?, {{BIND_TEXT}}, ?, ?, ?)
    mapping: {}

  queryHistoryListRecent:
    sql: |
      SELECT id, {{NATURAL_QUERY_SELECT}}, generated_sql, connection_id,
             executed, usage_count, last_used_at, created_at
      FROM query_history
      ORDER BY last_used_at DESC
      FETCH FIRST ? ROWS ONLY
    mapping: {}

  queryHistoryListFrequent:
    sql: |
      SELECT id, {{NATURAL_QUERY_SELECT}}, generated_sql, connection_id,
             executed, usage_count, last_used_at, created_at
      FROM query_history
      ORDER BY usage_count DESC, last_used_at DESC
      FETCH FIRST ? ROWS ONLY
    mapping: {}

  queryHistorySearch:
    sql: |
      SELECT id, {{NATURAL_QUERY_SELECT}}, generated_sql, connection_id,
             executed, usage_count, last_used_at, created_at
      FROM query_history
      WHERE UPPER(natural_query) LIKE UPPER(?)
      ORDER BY usage_count DESC, last_used_at DESC
      FETCH FIRST ? ROWS ONLY
    mapping: {}

  queryHistoryGetById:
    sql: |
      SELECT id, {{NATURAL_QUERY_SELECT}}, generated_sql, connection_id,
             executed, usage_count, last_used_at
      FROM query_history
      WHERE id = ?
    mapping: {}

  # ==========================================================================
  # glossary_manage: 용어 UPSERT (MERGE INTO)
  # ==========================================================================
  glossaryTermUpsert:
    sql: |
      MERGE INTO glossary_terms tgt
      USING (SELECT ? AS term_code FROM DUAL) src
      ON (tgt.term_code = src.term_code)
      WHEN MATCHED THEN UPDATE SET
        term                = {{BIND_TEXT}},
        category            = ?,
        sql_condition        = {{BIND_TEXT}},
        sql_condition_mysql  = {{BIND_TEXT}},
        sql_condition_oracle = {{BIND_TEXT}},
        apply_to_tables     = ?,
        required_columns    = ?,
        definition          = {{BIND_TEXT}},
        example_usage       = {{BIND_TEXT}},
        priority            = ?,
        updated_at          = SYSTIMESTAMP,
        updated_by          = ?
      WHEN NOT MATCHED THEN INSERT (
        term_code, term, category, sql_condition,
        sql_condition_mysql, sql_condition_oracle,
        apply_to_tables, required_columns,
        definition, example_usage, priority,
        is_active, created_by
      ) VALUES (
        ?, {{BIND_TEXT}}, ?, {{BIND_TEXT}},
        {{BIND_TEXT}}, {{BIND_TEXT}},
        ?, ?,
        {{BIND_TEXT}}, {{BIND_TEXT}}, ?,
        1, ?
      )
    mapping: {}

  # ==========================================================================
  # glossary_manage: 용어 별칭 UPSERT (MERGE INTO, NOT MATCHED only)
  # ==========================================================================
  glossaryAliasUpsert:
    sql: |
      MERGE INTO glossary_aliases tgt
      USING (SELECT ? AS term_code, {{BIND_TEXT}} AS alias, ? AS locale FROM DUAL) src
      ON (tgt.term_code = src.term_code AND tgt.alias = src.alias AND tgt.locale = src.locale)
      WHEN NOT MATCHED THEN INSERT (
        term_code, alias, locale, match_type, is_active
      ) VALUES (?, {{BIND_TEXT}}, ?, ?, 1)
    mapping: {}

  # ==========================================================================
  # glossary_manage: 용어 컨텍스트 UPSERT (MERGE INTO)
  # ==========================================================================
  glossaryContextUpsert:
    sql: |
      MERGE INTO glossary_contexts tgt
      USING (SELECT ? AS term_code, ? AS context_schema, ? AS context_table FROM DUAL) src
      ON (tgt.term_code = src.term_code AND tgt.context_schema = src.context_schema AND tgt.context_table = src.context_table)
      WHEN MATCHED THEN UPDATE SET
        sql_condition       = {{BIND_TEXT}},
        required_columns    = ?,
        context_definition  = {{BIND_TEXT}}
      WHEN NOT MATCHED THEN INSERT (
        term_code, context_schema, context_table,
        sql_condition, required_columns, context_definition, is_active
      ) VALUES (?, ?, ?, {{BIND_TEXT}}, ?, {{BIND_TEXT}}, 1)
    mapping: {}

  # ==========================================================================
  # glossary_manage: 용어 비활성화 (soft delete)
  # ==========================================================================
  glossaryTermDeactivate:
    sql: |
      UPDATE glossary_terms SET is_active = 0, updated_at = SYSTIMESTAMP
      WHERE term_code = ?
    mapping: {}

  # ==========================================================================
  # code_table_manage: 코드테이블 UPSERT (MERGE INTO)
  # ==========================================================================
  codeTableUpsert:
    sql: |
      MERGE INTO code_tables tgt
      USING (SELECT ? AS code_table_name FROM DUAL) src
      ON (tgt.code_table_name = src.code_table_name)
      WHEN MATCHED THEN UPDATE SET
        table_schema        = ?,
        table_name          = ?,
        group_code_column   = ?,
        code_column         = ?,
        code_name_column    = ?,
        description_column  = ?,
        sort_order_column   = ?,
        active_flag_column  = ?,
        active_flag_value   = ?,
        is_active           = ?,
        description         = {{BIND_TEXT}},
        updated_at          = SYSTIMESTAMP
      WHEN NOT MATCHED THEN INSERT (
        code_table_name, table_schema, table_name,
        group_code_column, code_column, code_name_column,
        description_column, sort_order_column,
        active_flag_column, active_flag_value,
        is_active, description
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, {{BIND_TEXT}})
    mapping: {}

  # ==========================================================================
  # code_table_manage: 컬럼-코드 매핑 UPSERT (MERGE INTO)
  # ==========================================================================
  columnCodeMappingUpsert:
    sql: |
      MERGE INTO column_code_mapping tgt
      USING (SELECT ? AS target_schema, ? AS target_table, ? AS target_column FROM DUAL) src
      ON (tgt.target_schema = src.target_schema AND tgt.target_table = src.target_table AND tgt.target_column = src.target_column)
      WHEN MATCHED THEN UPDATE SET
        code_table_name     = ?,
        group_code          = ?,
        display_name        = {{BIND_TEXT}},
        include_in_prompt   = ?,
        is_active           = ?,
        description         = {{BIND_TEXT}},
        updated_at          = SYSTIMESTAMP
      WHEN NOT MATCHED THEN INSERT (
        target_schema, target_table, target_column,
        code_table_name, group_code, display_name,
        include_in_prompt, is_active, description
      ) VALUES (?, ?, ?, ?, ?, {{BIND_TEXT}}, ?, ?, {{BIND_TEXT}})
    mapping: {}

  # ==========================================================================
  # code_table_manage: 코드 별칭 UPSERT (MERGE INTO, NOT MATCHED only)
  # ==========================================================================
  codeAliasUpsert:
    sql: |
      MERGE INTO code_aliases tgt
      USING (SELECT ? AS code_table_name, ? AS group_code, {{BIND_TEXT}} AS alias, ? AS locale FROM DUAL) src
      ON (tgt.code_table_name = src.code_table_name AND tgt.group_code = src.group_code AND tgt.alias = src.alias AND tgt.locale = src.locale)
      WHEN NOT MATCHED THEN INSERT (
        code_table_name, group_code, code_value,
        alias, locale, is_active
      ) VALUES (?, ?, ?, {{BIND_TEXT}}, ?, 1)
    mapping: {}

  # ==========================================================================
  # naming_convention_manage: 네이밍 컨벤션 UPSERT (MERGE INTO)
  # ==========================================================================
  namingConventionUpsert:
    sql: |
      MERGE INTO naming_conventions tgt
      USING (SELECT ? AS convention_name FROM DUAL) src
      ON (tgt.convention_name = src.convention_name)
      WHEN MATCHED THEN UPDATE SET
        column_pattern        = ?,
        target_table_pattern  = ?,
        target_column_pattern = ?,
        table_prefix_strip    = ?,
        table_suffix_strip    = ?,
        apply_pluralization   = ?,
        priority              = ?,
        apply_to_schemas      = ?,
        exclude_tables        = ?,
        description           = {{BIND_TEXT}},
        updated_at            = SYSTIMESTAMP
      WHEN NOT MATCHED THEN INSERT (
        convention_name, column_pattern, target_table_pattern,
        target_column_pattern, table_prefix_strip, table_suffix_strip,
        apply_pluralization, priority, apply_to_schemas,
        exclude_tables, is_active, description
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 1, {{BIND_TEXT}})
    mapping: {}

  # ==========================================================================
  # relationship_manage: 관계 비활성화
  # ==========================================================================
  relationshipDeactivate:
    sql: |
      UPDATE table_relationships SET is_active = 0, updated_at = SYSTIMESTAMP
      WHERE source_schema = ? AND source_table = ? AND source_column = ?
        AND target_schema = ? AND target_table = ? AND target_column = ?
    mapping: {}

  # ==========================================================================
  # auto_setup Stage 1: FK 제약조건 조회 (Oracle 시스템 카탈로그)
  # ==========================================================================
  autoImportFKSelect:
    sql: |
      SELECT
        fk.owner AS source_schema,
        fk_cc.table_name AS source_table,
        fk_cc.column_name AS source_column,
        pk.owner AS target_schema,
        pk_cc.table_name AS target_table,
        pk_cc.column_name AS target_column,
        CASE WHEN col.nullable = 'N' THEN 'INNER' ELSE 'LEFT' END AS join_hint,
        CASE
          WHEN EXISTS (
            SELECT 1 FROM all_constraints uc
            JOIN all_cons_columns ucc ON uc.constraint_name = ucc.constraint_name AND uc.owner = ucc.owner
            WHERE uc.constraint_type IN ('U', 'P')
              AND uc.owner = fk.owner
              AND ucc.table_name = fk_cc.table_name
              AND ucc.column_name = fk_cc.column_name
          ) THEN 'ONE_TO_ONE'
          ELSE 'MANY_TO_ONE'
        END AS relationship_type
      FROM all_constraints fk
      JOIN all_cons_columns fk_cc ON fk.constraint_name = fk_cc.constraint_name AND fk.owner = fk_cc.owner
      JOIN all_constraints pk ON fk.r_constraint_name = pk.constraint_name AND fk.r_owner = pk.owner
      JOIN all_cons_columns pk_cc ON pk.constraint_name = pk_cc.constraint_name AND pk.owner = pk_cc.owner
        AND fk_cc.position = pk_cc.position
      JOIN all_tab_columns col ON col.owner = fk.owner AND col.table_name = fk_cc.table_name AND col.column_name = fk_cc.column_name
      WHERE fk.constraint_type = 'R'
        AND fk.owner NOT IN ('SYS','SYSTEM','XDB','CTXSYS','MDSYS','OLAPSYS','WMSYS','NL2SQL')
        AND pk.owner NOT IN ('SYS','SYSTEM','XDB','CTXSYS','MDSYS','OLAPSYS','WMSYS','NL2SQL')
    mapping:
      sourceSchema: source_schema
      sourceTable: source_table
      sourceColumn: source_column
      targetSchema: target_schema
      targetTable: target_table
      targetColumn: target_column
      joinHint: join_hint
      relationshipType: relationship_type

  # ==========================================================================
  # auto_setup Stage 2: 코드테이블 휴리스틱 탐지 (Oracle)
  # ==========================================================================
  autoImportCodeTableSelect:
    sql: |
      WITH table_stats AS (
        SELECT owner AS table_schema, table_name, NVL(num_rows, 0) AS estimated_rows
        FROM all_tables
        WHERE owner NOT IN ('SYS','SYSTEM','XDB','CTXSYS','MDSYS','OLAPSYS','WMSYS','NL2SQL')
          AND NVL(num_rows, 0) BETWEEN 1 AND 1000
      ),
      column_analysis AS (
        SELECT ts.table_schema, ts.table_name, ts.estimated_rows,
          CASE WHEN EXISTS (SELECT 1 FROM all_tab_columns c WHERE c.owner = ts.table_schema AND c.table_name = ts.table_name AND (LOWER(c.column_name) LIKE '%code%' OR LOWER(c.column_name) LIKE '%cd%')) THEN 1 ELSE 0 END AS has_code_col,
          CASE WHEN EXISTS (SELECT 1 FROM all_tab_columns c WHERE c.owner = ts.table_schema AND c.table_name = ts.table_name AND (LOWER(c.column_name) LIKE '%name%' OR LOWER(c.column_name) LIKE '%nm%' OR LOWER(c.column_name) LIKE '%label%')) THEN 1 ELSE 0 END AS has_name_col,
          CASE WHEN EXISTS (SELECT 1 FROM all_tab_columns c WHERE c.owner = ts.table_schema AND c.table_name = ts.table_name AND (LOWER(c.column_name) LIKE '%group%' OR LOWER(c.column_name) LIKE '%type%' OR LOWER(c.column_name) LIKE '%category%')) THEN 1 ELSE 0 END AS has_group_col,
          CASE WHEN EXISTS (SELECT 1 FROM all_tab_columns c WHERE c.owner = ts.table_schema AND c.table_name = ts.table_name AND (LOWER(c.column_name) LIKE '%order%' OR LOWER(c.column_name) LIKE '%seq%' OR LOWER(c.column_name) LIKE '%sort%')) THEN 1 ELSE 0 END AS has_sort_col,
          CASE WHEN EXISTS (SELECT 1 FROM all_tab_columns c WHERE c.owner = ts.table_schema AND c.table_name = ts.table_name AND (LOWER(c.column_name) LIKE '%active%' OR LOWER(c.column_name) LIKE '%use%' OR LOWER(c.column_name) LIKE '%_yn')) THEN 1 ELSE 0 END AS has_active_col,
          CASE WHEN REGEXP_LIKE(LOWER(ts.table_name), '(code|cd|common|master|lookup|ref|type|status|category)') THEN 2 ELSE 0 END AS name_score,
          (SELECT COUNT(*) FROM all_constraints ac JOIN all_cons_columns acc ON ac.constraint_name = acc.constraint_name AND ac.owner = acc.owner WHERE ac.constraint_type = 'R' AND acc.table_name = ts.table_name AND acc.owner = ts.table_schema) AS ref_count
        FROM table_stats ts
      ),
      code_candidates AS (
        SELECT ca.*,
          (ca.has_code_col + ca.has_name_col + ca.has_group_col + ca.has_sort_col + ca.has_active_col + ca.name_score + CASE WHEN ca.ref_count >= 2 THEN 2 ELSE 0 END) AS total_score,
          (SELECT c.column_name FROM all_tab_columns c WHERE c.owner = ca.table_schema AND c.table_name = ca.table_name AND (LOWER(c.column_name) LIKE '%code%' OR LOWER(c.column_name) LIKE '%cd%') AND ROWNUM = 1 ORDER BY c.column_id) AS guessed_code_col,
          (SELECT c.column_name FROM all_tab_columns c WHERE c.owner = ca.table_schema AND c.table_name = ca.table_name AND (LOWER(c.column_name) LIKE '%name%' OR LOWER(c.column_name) LIKE '%nm%' OR LOWER(c.column_name) LIKE '%label%') AND ROWNUM = 1 ORDER BY c.column_id) AS guessed_name_col,
          (SELECT c.column_name FROM all_tab_columns c WHERE c.owner = ca.table_schema AND c.table_name = ca.table_name AND (LOWER(c.column_name) LIKE '%group%' OR LOWER(c.column_name) LIKE '%type%' OR LOWER(c.column_name) LIKE '%category%') AND ROWNUM = 1 ORDER BY c.column_id) AS guessed_group_col,
          (SELECT c.column_name FROM all_tab_columns c WHERE c.owner = ca.table_schema AND c.table_name = ca.table_name AND (LOWER(c.column_name) LIKE '%order%' OR LOWER(c.column_name) LIKE '%seq%' OR LOWER(c.column_name) LIKE '%sort%') AND ROWNUM = 1 ORDER BY c.column_id) AS guessed_sort_col,
          (SELECT c.column_name FROM all_tab_columns c WHERE c.owner = ca.table_schema AND c.table_name = ca.table_name AND (LOWER(c.column_name) LIKE '%active%' OR LOWER(c.column_name) LIKE '%use%' OR LOWER(c.column_name) LIKE '%_yn') AND ROWNUM = 1 ORDER BY c.column_id) AS guessed_active_col
        FROM column_analysis ca
      )
      SELECT * FROM code_candidates WHERE total_score >= 3
    mapping:
      tableSchema: table_schema
      tableName: table_name
      estimatedRows: estimated_rows
      totalScore: total_score
      guessedCodeCol: guessed_code_col
      guessedNameCol: guessed_name_col
      guessedGroupCol: guessed_group_col
      guessedSortCol: guessed_sort_col
      guessedActiveCol: guessed_active_col

  # ==========================================================================
  # auto_setup Stage 3: FK→코드테이블 매핑 탐지
  # ==========================================================================
  autoImportCodeMappingSelect:
    sql: |
      SELECT
        tr.source_schema,
        tr.source_table,
        tr.source_column,
        ct.code_table_name
      FROM table_relationships tr
      JOIN code_tables ct
        ON tr.target_schema = ct.table_schema
        AND tr.target_table = ct.table_name
      WHERE tr.created_by = 'auto_import'
        AND NOT EXISTS (
          SELECT 1 FROM column_code_mapping ccm
          WHERE ccm.target_schema = tr.source_schema
            AND ccm.target_table = tr.source_table
            AND ccm.target_column = tr.source_column
        )
    mapping:
      sourceSchema: source_schema
      sourceTable: source_table
      sourceColumn: source_column
      codeTableName: code_table_name

# ============================================================================
# DDL: 메타데이터 테이블 자동 생성 (현재 사용자 스키마)
# ============================================================================
# Oracle은 CREATE TABLE IF NOT EXISTS를 지원하지 않으므로
# TypeScript에서 user_tables 조회 후 존재하지 않는 테이블만 생성
ddl:
  tables:
    - name: table_relationships
      createSql: |
        CREATE TABLE table_relationships (
          id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          source_schema VARCHAR2(128) NOT NULL,
          source_table VARCHAR2(128) NOT NULL,
          source_column VARCHAR2(128) NOT NULL,
          target_schema VARCHAR2(128) NOT NULL,
          target_table VARCHAR2(128) NOT NULL,
          target_column VARCHAR2(128) NOT NULL,
          relationship_type VARCHAR2(20) DEFAULT 'MANY_TO_ONE' NOT NULL,
          confidence_level VARCHAR2(10) DEFAULT 'HIGH' NOT NULL,
          join_hint VARCHAR2(20),
          polymorphic_type_column VARCHAR2(128),
          polymorphic_type_value VARCHAR2(128),
          description VARCHAR2(4000),
          business_context VARCHAR2(4000),
          is_active NUMBER(1) DEFAULT 1 NOT NULL,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          created_by VARCHAR2(100),
          updated_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          updated_by VARCHAR2(100),
          CONSTRAINT uk_table_rel UNIQUE (source_schema, source_table, source_column,
                                          target_schema, target_table, target_column),
          CONSTRAINT chk_rel_type CHECK (relationship_type IN ('ONE_TO_ONE','ONE_TO_MANY','MANY_TO_ONE','MANY_TO_MANY')),
          CONSTRAINT chk_conf_level CHECK (confidence_level IN ('HIGH','MEDIUM','LOW')),
          CONSTRAINT chk_join_hint CHECK (join_hint IS NULL OR join_hint IN ('INNER','LEFT','RIGHT')),
          CONSTRAINT chk_rel_active CHECK (is_active IN (0, 1))
        )
      indexes:
        - CREATE INDEX idx_rel_source ON table_relationships(source_schema, source_table)
        - CREATE INDEX idx_rel_target ON table_relationships(target_schema, target_table)
        - CREATE INDEX idx_rel_active ON table_relationships(is_active)

    - name: naming_conventions
      createSql: |
        CREATE TABLE naming_conventions (
          id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          convention_name VARCHAR2(100) NOT NULL,
          column_pattern VARCHAR2(255) NOT NULL,
          target_table_pattern VARCHAR2(255) NOT NULL,
          target_column_pattern VARCHAR2(255) DEFAULT 'id' NOT NULL,
          table_prefix_strip VARCHAR2(50),
          table_suffix_strip VARCHAR2(50),
          apply_pluralization NUMBER(1) DEFAULT 1,
          priority NUMBER DEFAULT 100 NOT NULL,
          apply_to_schemas CLOB,
          exclude_tables CLOB,
          is_active NUMBER(1) DEFAULT 1 NOT NULL,
          description CLOB,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          updated_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          CONSTRAINT uk_naming_conv UNIQUE (convention_name),
          CONSTRAINT chk_naming_active CHECK (is_active IN (0, 1)),
          CONSTRAINT chk_naming_plural CHECK (apply_pluralization IN (0, 1))
        )
      indexes:
        - CREATE INDEX idx_naming_priority ON naming_conventions(priority, is_active)

    - name: code_tables
      createSql: |
        CREATE TABLE code_tables (
          id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          code_table_name VARCHAR2(100) NOT NULL,
          table_schema VARCHAR2(128) NOT NULL,
          table_name VARCHAR2(128) NOT NULL,
          group_code_column VARCHAR2(128) NOT NULL,
          code_column VARCHAR2(128) NOT NULL,
          code_name_column VARCHAR2(128) NOT NULL,
          description_column VARCHAR2(128),
          sort_order_column VARCHAR2(128),
          active_flag_column VARCHAR2(128),
          active_flag_value VARCHAR2(50),
          additional_filter CLOB,
          locale_column VARCHAR2(128),
          default_locale VARCHAR2(10) DEFAULT 'ko',
          is_active NUMBER(1) DEFAULT 1 NOT NULL,
          description CLOB,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          updated_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          CONSTRAINT uk_code_table_name UNIQUE (code_table_name),
          CONSTRAINT uk_code_table_loc UNIQUE (table_schema, table_name),
          CONSTRAINT chk_code_active CHECK (is_active IN (0, 1))
        )

    - name: column_code_mapping
      createSql: |
        CREATE TABLE column_code_mapping (
          id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          target_schema VARCHAR2(128) NOT NULL,
          target_table VARCHAR2(128) NOT NULL,
          target_column VARCHAR2(128) NOT NULL,
          code_table_name VARCHAR2(100) NOT NULL,
          group_code VARCHAR2(100) NOT NULL,
          display_name VARCHAR2(200),
          include_in_prompt NUMBER(1) DEFAULT 1 NOT NULL,
          is_active NUMBER(1) DEFAULT 1 NOT NULL,
          description CLOB,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          updated_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          CONSTRAINT uk_col_code_mapping UNIQUE (target_schema, target_table, target_column),
          CONSTRAINT chk_col_mapping_active CHECK (is_active IN (0, 1)),
          CONSTRAINT chk_col_mapping_prompt CHECK (include_in_prompt IN (0, 1)),
          CONSTRAINT fk_col_mapping_code_table
            FOREIGN KEY (code_table_name) REFERENCES code_tables(code_table_name) ON DELETE CASCADE
        )
      indexes:
        - CREATE INDEX idx_col_mapping_table ON column_code_mapping(target_schema, target_table)
        - CREATE INDEX idx_col_mapping_code ON column_code_mapping(code_table_name, group_code)

    - name: code_aliases
      createSql: |
        CREATE TABLE code_aliases (
          id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          code_table_name VARCHAR2(100) NOT NULL,
          group_code VARCHAR2(100) NOT NULL,
          code_value VARCHAR2(100) NOT NULL,
          alias VARCHAR2(200) NOT NULL,
          locale VARCHAR2(10) DEFAULT 'ko',
          is_active NUMBER(1) DEFAULT 1 NOT NULL,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          CONSTRAINT uk_code_alias UNIQUE (code_table_name, group_code, alias, locale),
          CONSTRAINT chk_alias_active CHECK (is_active IN (0, 1)),
          CONSTRAINT fk_alias_code_table
            FOREIGN KEY (code_table_name) REFERENCES code_tables(code_table_name) ON DELETE CASCADE
        )
      indexes:
        - CREATE INDEX idx_code_alias_lookup ON code_aliases(alias, locale)

    - name: glossary_terms
      createSql: |
        CREATE TABLE glossary_terms (
          id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          term_code VARCHAR2(100) NOT NULL,
          term VARCHAR2(200) NOT NULL,
          category VARCHAR2(50),
          sql_condition CLOB NOT NULL,
          sql_condition_pg CLOB,
          sql_condition_mysql CLOB,
          apply_to_tables CLOB,
          required_columns CLOB NOT NULL,
          definition CLOB NOT NULL,
          example_usage CLOB,
          example_sql CLOB,
          business_context CLOB,
          priority NUMBER DEFAULT 100 NOT NULL,
          is_active NUMBER(1) DEFAULT 1 NOT NULL,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          created_by VARCHAR2(100),
          updated_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          updated_by VARCHAR2(100),
          CONSTRAINT uk_glossary_term_code UNIQUE (term_code),
          CONSTRAINT chk_glossary_category CHECK (category IS NULL OR category IN (
            'CUSTOMER','ORDER','PRODUCT','DATE','STATUS','METRIC','GENERAL'
          )),
          CONSTRAINT chk_glossary_active CHECK (is_active IN (0, 1))
        )
      indexes:
        - CREATE INDEX idx_glossary_term ON glossary_terms(term)
        - CREATE INDEX idx_glossary_category ON glossary_terms(category)
        - CREATE INDEX idx_glossary_active ON glossary_terms(is_active)

    - name: glossary_aliases
      createSql: |
        CREATE TABLE glossary_aliases (
          id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          term_code VARCHAR2(100) NOT NULL,
          alias VARCHAR2(200) NOT NULL,
          locale VARCHAR2(10) DEFAULT 'ko',
          match_type VARCHAR2(20) DEFAULT 'EXACT' NOT NULL,
          is_active NUMBER(1) DEFAULT 1 NOT NULL,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          CONSTRAINT uk_glossary_alias UNIQUE (term_code, alias, locale),
          CONSTRAINT chk_alias_match_type CHECK (match_type IN ('EXACT','CONTAINS','STARTS_WITH','ENDS_WITH','REGEX')),
          CONSTRAINT chk_g_alias_active CHECK (is_active IN (0, 1)),
          CONSTRAINT fk_glossary_alias_term
            FOREIGN KEY (term_code) REFERENCES glossary_terms(term_code) ON DELETE CASCADE
        )
      indexes:
        - CREATE INDEX idx_glossary_alias_lookup ON glossary_aliases(alias, locale)

    - name: glossary_contexts
      createSql: |
        CREATE TABLE glossary_contexts (
          id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          term_code VARCHAR2(100) NOT NULL,
          context_schema VARCHAR2(128) NOT NULL,
          context_table VARCHAR2(128) NOT NULL,
          sql_condition CLOB NOT NULL,
          sql_condition_pg CLOB,
          sql_condition_mysql CLOB,
          required_columns CLOB NOT NULL,
          context_definition CLOB,
          is_active NUMBER(1) DEFAULT 1 NOT NULL,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          CONSTRAINT uk_glossary_context UNIQUE (term_code, context_schema, context_table),
          CONSTRAINT chk_g_ctx_active CHECK (is_active IN (0, 1)),
          CONSTRAINT fk_glossary_ctx_term
            FOREIGN KEY (term_code) REFERENCES glossary_terms(term_code) ON DELETE CASCADE
        )
      indexes:
        - CREATE INDEX idx_glossary_ctx_table ON glossary_contexts(context_schema, context_table)

    - name: query_patterns
      createSql: |
        CREATE TABLE query_patterns (
          id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          pattern_code VARCHAR2(100) NOT NULL,
          pattern_name VARCHAR2(200) NOT NULL,
          category VARCHAR2(50),
          sql_template CLOB NOT NULL,
          sql_template_pg CLOB,
          sql_template_mysql CLOB,
          applicable_tables CLOB,
          required_columns CLOB,
          required_joins CLOB,
          match_score_threshold NUMBER DEFAULT 70 NOT NULL,
          priority NUMBER DEFAULT 100 NOT NULL,
          description CLOB NOT NULL,
          use_case CLOB,
          example_input CLOB,
          example_output CLOB,
          performance_notes CLOB,
          is_active NUMBER(1) DEFAULT 1 NOT NULL,
          usage_count NUMBER DEFAULT 0 NOT NULL,
          last_used_at TIMESTAMP WITH TIME ZONE,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          created_by VARCHAR2(100),
          updated_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
          updated_by VARCHAR2(100),
          CONSTRAINT uk_pattern_code UNIQUE (pattern_code),
          CONSTRAINT chk_pattern_category CHECK (category IS NULL OR category IN (
            'AGGREGATION','REPORT','LOOKUP','ANALYSIS','COMPARISON','TREND','RANKING','GENERAL'
          )),
          CONSTRAINT chk_match_score CHECK (match_score_threshold BETWEEN 0 AND 100),
          CONSTRAINT chk_pattern_active CHECK (is_active IN (0, 1))
        )
      indexes:
        - CREATE INDEX idx_pattern_category ON query_patterns(category)
        - CREATE INDEX idx_pattern_active ON query_patterns(is_active)
        - CREATE INDEX idx_pattern_priority ON query_patterns(priority)

    - name: pattern_parameters
      createSql: |
        CREATE TABLE pattern_parameters (
          id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          pattern_code VARCHAR2(100) NOT NULL,
          param_name VARCHAR2(100) NOT NULL,
          param_type VARCHAR2(30) NOT NULL,
          is_required NUMBER(1) DEFAULT 1 NOT NULL,
          default_value CLOB,
          allowed_values CLOB,
          validation_pattern VARCHAR2(255),
          infer_from_keywords CLOB,
          infer_from_column_type VARCHAR2(50),
          description CLOB,
          example_value CLOB,
          display_order NUMBER DEFAULT 0 NOT NULL,
          is_active NUMBER(1) DEFAULT 1 NOT NULL,
          CONSTRAINT uk_pattern_param UNIQUE (pattern_code, param_name),
          CONSTRAINT chk_param_type CHECK (param_type IN ('COLUMN','TABLE','VALUE','DATE','NUMBER','EXPRESSION','CONDITION')),
          CONSTRAINT chk_param_required CHECK (is_required IN (0, 1)),
          CONSTRAINT chk_param_active CHECK (is_active IN (0, 1)),
          CONSTRAINT fk_param_pattern
            FOREIGN KEY (pattern_code) REFERENCES query_patterns(pattern_code) ON DELETE CASCADE
        )
      indexes:
        - CREATE INDEX idx_pattern_params ON pattern_parameters(pattern_code)

    - name: pattern_keywords
      createSql: |
        CREATE TABLE pattern_keywords (
          id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          pattern_code VARCHAR2(100) NOT NULL,
          keyword VARCHAR2(100) NOT NULL,
          locale VARCHAR2(10) DEFAULT 'ko',
          weight NUMBER DEFAULT 10 NOT NULL,
          match_type VARCHAR2(20) DEFAULT 'CONTAINS' NOT NULL,
          is_required NUMBER(1) DEFAULT 0 NOT NULL,
          is_active NUMBER(1) DEFAULT 1 NOT NULL,
          CONSTRAINT chk_kw_weight CHECK (weight BETWEEN 1 AND 100),
          CONSTRAINT chk_kw_match_type CHECK (match_type IN ('EXACT','CONTAINS','STARTS_WITH','ENDS_WITH','REGEX')),
          CONSTRAINT chk_kw_required CHECK (is_required IN (0, 1)),
          CONSTRAINT chk_kw_active CHECK (is_active IN (0, 1)),
          CONSTRAINT fk_kw_pattern
            FOREIGN KEY (pattern_code) REFERENCES query_patterns(pattern_code) ON DELETE CASCADE
        )
      indexes:
        - CREATE INDEX idx_pattern_kw_lookup ON pattern_keywords(keyword, locale)
        - CREATE INDEX idx_pattern_kw_pattern ON pattern_keywords(pattern_code)

    - name: query_history
      createSql: |
        CREATE TABLE query_history (
          id            NUMBER        GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          query_hash    VARCHAR2(64)  NOT NULL,
          natural_query CLOB          NOT NULL,
          generated_sql CLOB,
          connection_id VARCHAR2(100),
          executed      NUMBER(1)     DEFAULT 0 NOT NULL,
          usage_count   NUMBER        DEFAULT 1 NOT NULL,
          last_used_at  TIMESTAMP     DEFAULT CURRENT_TIMESTAMP NOT NULL,
          created_at    TIMESTAMP     DEFAULT CURRENT_TIMESTAMP NOT NULL,
          CONSTRAINT uk_nl2sql_qhist_hash UNIQUE (query_hash),
          CONSTRAINT chk_qhist_executed CHECK (executed IN (0, 1))
        )
      indexes:
        - CREATE INDEX idx_nl2sql_qhist_usage ON query_history(usage_count)
        - CREATE INDEX idx_nl2sql_qhist_last  ON query_history(last_used_at)
        - CREATE INDEX idx_nl2sql_qhist_conn  ON query_history(connection_id)
