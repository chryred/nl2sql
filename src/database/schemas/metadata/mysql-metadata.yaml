# ============================================================================
# NL2SQL 메타데이터 조회 쿼리 (MySQL)
# ============================================================================
#
# MySQL 특화 사항:
#   - 데이터베이스명이 스키마 역할 (nl2sql 데이터베이스)
#   - JSON 함수로 배열 데이터 처리
#   - TINYINT(1)이 BOOLEAN 역할
# ============================================================================

metadataSchema: nl2sql

queries:
  # ==========================================================================
  # 테이블 관계 조회
  # ==========================================================================
  relationships:
    sql: |
      SELECT
        source_schema,
        source_table,
        source_column,
        target_schema,
        target_table,
        target_column,
        relationship_type,
        confidence_level,
        join_hint,
        polymorphic_type_column,
        polymorphic_type_value,
        description
      FROM table_relationships
      WHERE is_active = 1
      ORDER BY source_schema, source_table, source_column
    mapping:
      sourceSchema: source_schema
      sourceTable: source_table
      sourceColumn: source_column
      targetSchema: target_schema
      targetTable: target_table
      targetColumn: target_column
      relationshipType: relationship_type
      confidence: confidence_level
      joinHint: join_hint

  # ==========================================================================
  # 네이밍 컨벤션 조회
  # ==========================================================================
  namingConventions:
    sql: |
      SELECT
        convention_name,
        column_pattern,
        target_table_pattern,
        target_column_pattern,
        table_prefix_strip,
        table_suffix_strip,
        apply_pluralization,
        priority,
        apply_to_schemas,
        exclude_tables,
        description
      FROM naming_conventions
      WHERE is_active = 1
      ORDER BY priority
    mapping:
      name: convention_name
      columnPattern: column_pattern
      targetTablePattern: target_table_pattern
      targetColumnPattern: target_column_pattern
      applyPluralization: apply_pluralization
      priority: priority
      applyToSchemas: apply_to_schemas
      excludeTables: exclude_tables

  # ==========================================================================
  # 공통코드 테이블 설정 조회
  # ==========================================================================
  codeTables:
    sql: |
      SELECT
        code_table_name,
        table_schema,
        table_name,
        group_code_column,
        code_column,
        code_name_column,
        description_column,
        sort_order_column,
        active_flag_column,
        active_flag_value,
        additional_filter,
        locale_column,
        default_locale
      FROM code_tables
      WHERE is_active = 1
    mapping:
      codeTableName: code_table_name
      tableSchema: table_schema
      tableName: table_name
      groupCodeColumn: group_code_column
      codeColumn: code_column
      codeNameColumn: code_name_column
      descriptionColumn: description_column
      sortOrderColumn: sort_order_column
      activeFlagColumn: active_flag_column
      activeFlagValue: active_flag_value
      additionalFilter: additional_filter

  # ==========================================================================
  # 컬럼-코드 매핑 조회
  # ==========================================================================
  columnCodeMappings:
    sql: |
      SELECT
        target_schema,
        target_table,
        target_column,
        code_table_name,
        group_code,
        display_name,
        include_in_prompt
      FROM column_code_mapping
      WHERE is_active = 1
      ORDER BY target_schema, target_table, target_column
    mapping:
      targetSchema: target_schema
      targetTable: target_table
      targetColumn: target_column
      codeTableName: code_table_name
      groupCode: group_code
      displayName: display_name
      includeInPrompt: include_in_prompt

  # ==========================================================================
  # 코드 별칭 조회
  # ==========================================================================
  codeAliases:
    sql: |
      SELECT
        code_table_name,
        group_code,
        code_value,
        alias,
        locale
      FROM code_aliases
      WHERE is_active = 1
    mapping:
      codeTableName: code_table_name
      groupCode: group_code
      codeValue: code_value
      alias: alias
      locale: locale

  # ==========================================================================
  # 용어집 조회 (MySQL용 SQL 조건이 기본)
  # ==========================================================================
  glossaryTerms:
    sql: |
      SELECT
        term_code,
        term,
        category,
        sql_condition,
        sql_condition_pg,
        sql_condition_oracle,
        apply_to_tables,
        required_columns,
        definition,
        example_usage,
        priority
      FROM glossary_terms
      WHERE is_active = 1
      ORDER BY priority
    mapping:
      termCode: term_code
      term: term
      category: category
      sqlCondition: sql_condition
      sqlConditionPg: sql_condition_pg
      sqlConditionOracle: sql_condition_oracle
      applyToTables: apply_to_tables
      requiredColumns: required_columns
      definition: definition
      exampleUsage: example_usage
      priority: priority

  # ==========================================================================
  # 용어 별칭 조회
  # ==========================================================================
  glossaryAliases:
    sql: |
      SELECT
        term_code,
        alias,
        locale,
        match_type
      FROM glossary_aliases
      WHERE is_active = 1
    mapping:
      termCode: term_code
      alias: alias
      locale: locale
      matchType: match_type

  # ==========================================================================
  # 용어 컨텍스트 조회
  # ==========================================================================
  glossaryContexts:
    sql: |
      SELECT
        term_code,
        context_schema,
        context_table,
        sql_condition,
        sql_condition_pg,
        sql_condition_oracle,
        required_columns,
        context_definition
      FROM glossary_contexts
      WHERE is_active = 1
    mapping:
      termCode: term_code
      contextSchema: context_schema
      contextTable: context_table
      sqlCondition: sql_condition
      requiredColumns: required_columns
      contextDefinition: context_definition

  # ==========================================================================
  # 쿼리 패턴 조회 (MySQL용 템플릿이 기본)
  # ==========================================================================
  queryPatterns:
    sql: |
      SELECT
        pattern_code,
        pattern_name,
        category,
        sql_template,
        sql_template_pg,
        sql_template_oracle,
        applicable_tables,
        required_columns,
        required_joins,
        match_score_threshold,
        priority,
        description,
        example_input,
        example_output
      FROM query_patterns
      WHERE is_active = 1
      ORDER BY priority
    mapping:
      patternCode: pattern_code
      patternName: pattern_name
      category: category
      sqlTemplate: sql_template
      sqlTemplatePg: sql_template_pg
      sqlTemplateOracle: sql_template_oracle
      applicableTables: applicable_tables
      requiredColumns: required_columns
      requiredJoins: required_joins
      matchScoreThreshold: match_score_threshold
      priority: priority
      description: description
      exampleInput: example_input
      exampleOutput: example_output

  # ==========================================================================
  # 패턴 파라미터 조회
  # ==========================================================================
  patternParameters:
    sql: |
      SELECT
        pattern_code,
        param_name,
        param_type,
        is_required,
        default_value,
        allowed_values,
        infer_from_keywords,
        infer_from_column_type,
        description,
        display_order
      FROM pattern_parameters
      WHERE is_active = 1
      ORDER BY pattern_code, display_order
    mapping:
      patternCode: pattern_code
      paramName: param_name
      paramType: param_type
      isRequired: is_required
      defaultValue: default_value
      allowedValues: allowed_values
      inferFromKeywords: infer_from_keywords
      inferFromColumnType: infer_from_column_type
      description: description
      displayOrder: display_order

  # ==========================================================================
  # 패턴 키워드 조회
  # ==========================================================================
  patternKeywords:
    sql: |
      SELECT
        pattern_code,
        keyword,
        locale,
        weight,
        match_type,
        is_required
      FROM pattern_keywords
      WHERE is_active = 1
    mapping:
      patternCode: pattern_code
      keyword: keyword
      locale: locale
      weight: weight
      matchType: match_type
      isRequired: is_required

  # ==========================================================================
  # 추론용: 관계 UPSERT (INSERT IGNORE)
  # ==========================================================================
  inferenceUpsert:
    sql: |
      INSERT IGNORE INTO table_relationships (
        source_schema, source_table, source_column,
        target_schema, target_table, target_column,
        relationship_type, confidence_level, join_hint,
        description, is_active, created_by
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
    mapping: {}

  # ==========================================================================
  # query_pattern_add: 쿼리 패턴 등록
  # ==========================================================================
  queryPatternInsert:
    sql: |
      INSERT INTO query_patterns (
        pattern_code, pattern_name, category,
        sql_template, sql_template_mysql, sql_template_oracle,
        applicable_tables, match_score_threshold, priority,
        description, example_input, is_active, created_by
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 1, 'mcp_user')
      ON DUPLICATE KEY UPDATE
        pattern_name        = VALUES(pattern_name),
        category            = VALUES(category),
        sql_template        = VALUES(sql_template),
        sql_template_mysql  = VALUES(sql_template_mysql),
        sql_template_oracle = VALUES(sql_template_oracle),
        applicable_tables   = VALUES(applicable_tables),
        description         = VALUES(description),
        example_input       = VALUES(example_input),
        updated_at          = NOW()
    mapping: {}

  # ==========================================================================
  # query_pattern_add: 패턴 키워드 등록 (중복 무시)
  # ==========================================================================
  queryPatternKeywordInsert:
    sql: |
      INSERT IGNORE INTO pattern_keywords (
        pattern_code, keyword, locale, weight, match_type, is_required
      ) VALUES (?, ?, 'ko', 10, 'CONTAINS', 0)
    mapping: {}

  # ==========================================================================
  # query_pattern_search: 패턴명/설명 키워드 검색
  # ==========================================================================
  queryPatternSearch:
    sql: |
      SELECT
        qp.pattern_code,
        qp.pattern_name,
        qp.category,
        qp.sql_template,
        qp.description,
        qp.example_input,
        qp.applicable_tables,
        GROUP_CONCAT(pk.keyword ORDER BY pk.keyword SEPARATOR ',') AS keywords
      FROM query_patterns qp
      LEFT JOIN pattern_keywords pk
             ON pk.pattern_code = qp.pattern_code AND pk.is_active = 1
      WHERE qp.is_active = 1
        AND (qp.pattern_name LIKE ? OR qp.description LIKE ?)
      GROUP BY qp.pattern_code, qp.pattern_name, qp.category,
               qp.sql_template, qp.description, qp.example_input, qp.applicable_tables
      ORDER BY qp.priority
      LIMIT ?
    mapping: {}

  # ==========================================================================
  # query_history_*: 쿼리 이력 관리
  # ==========================================================================
  queryHistoryUpsert:
    sql: |
      INSERT INTO query_history (
        query_hash, natural_query, generated_sql, connection_id, executed
      ) VALUES (?, ?, ?, ?, ?)
      ON DUPLICATE KEY UPDATE
        usage_count   = query_history.usage_count + 1,
        last_used_at  = NOW(),
        generated_sql = VALUES(generated_sql),
        executed      = query_history.executed OR VALUES(executed)
    mapping: {}

  queryHistoryListRecent:
    sql: |
      SELECT id, natural_query, generated_sql, connection_id,
             executed, usage_count, last_used_at, created_at
      FROM query_history
      ORDER BY last_used_at DESC
      LIMIT ?
    mapping: {}

  queryHistoryListFrequent:
    sql: |
      SELECT id, natural_query, generated_sql, connection_id,
             executed, usage_count, last_used_at, created_at
      FROM query_history
      ORDER BY usage_count DESC, last_used_at DESC
      LIMIT ?
    mapping: {}

  queryHistorySearch:
    sql: |
      SELECT id, natural_query, generated_sql, connection_id,
             executed, usage_count, last_used_at, created_at
      FROM query_history
      WHERE natural_query LIKE ?
      ORDER BY usage_count DESC, last_used_at DESC
      LIMIT ?
    mapping: {}

  queryHistoryGetById:
    sql: |
      SELECT id, natural_query, generated_sql, connection_id,
             executed, usage_count, last_used_at
      FROM query_history
      WHERE id = ?
    mapping: {}

  # ==========================================================================
  # glossary_manage: 용어 UPSERT
  # ==========================================================================
  glossaryTermUpsert:
    sql: |
      INSERT INTO glossary_terms (
        term_code, term, category, sql_condition,
        sql_condition_pg, sql_condition_oracle,
        apply_to_tables, required_columns,
        definition, example_usage, priority,
        is_active, created_by
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 1, ?)
      ON DUPLICATE KEY UPDATE
        term               = VALUES(term),
        category           = VALUES(category),
        sql_condition      = VALUES(sql_condition),
        sql_condition_pg   = VALUES(sql_condition_pg),
        sql_condition_oracle = VALUES(sql_condition_oracle),
        apply_to_tables    = VALUES(apply_to_tables),
        required_columns   = VALUES(required_columns),
        definition         = VALUES(definition),
        example_usage      = VALUES(example_usage),
        priority           = VALUES(priority),
        updated_at         = NOW(),
        updated_by         = VALUES(created_by)
    mapping: {}

  # ==========================================================================
  # glossary_manage: 용어 별칭 UPSERT
  # ==========================================================================
  glossaryAliasUpsert:
    sql: |
      INSERT IGNORE INTO glossary_aliases (
        term_code, alias, locale, match_type, is_active
      ) VALUES (?, ?, ?, ?, 1)
    mapping: {}

  # ==========================================================================
  # glossary_manage: 용어 컨텍스트 UPSERT
  # ==========================================================================
  glossaryContextUpsert:
    sql: |
      INSERT INTO glossary_contexts (
        term_code, context_schema, context_table,
        sql_condition, required_columns, context_definition, is_active
      ) VALUES (?, ?, ?, ?, ?, ?, 1)
      ON DUPLICATE KEY UPDATE
        sql_condition      = VALUES(sql_condition),
        required_columns   = VALUES(required_columns),
        context_definition = VALUES(context_definition)
    mapping: {}

  # ==========================================================================
  # glossary_manage: 용어 비활성화 (soft delete)
  # ==========================================================================
  glossaryTermDeactivate:
    sql: |
      UPDATE glossary_terms SET is_active = 0, updated_at = NOW()
      WHERE term_code = ?
    mapping: {}

  # ==========================================================================
  # code_table_manage: 코드테이블 UPSERT
  # ==========================================================================
  codeTableUpsert:
    sql: |
      INSERT INTO code_tables (
        code_table_name, table_schema, table_name,
        group_code_column, code_column, code_name_column,
        description_column, sort_order_column,
        active_flag_column, active_flag_value,
        is_active, description
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
      ON DUPLICATE KEY UPDATE
        table_schema       = VALUES(table_schema),
        table_name         = VALUES(table_name),
        group_code_column  = VALUES(group_code_column),
        code_column        = VALUES(code_column),
        code_name_column   = VALUES(code_name_column),
        description_column = VALUES(description_column),
        sort_order_column  = VALUES(sort_order_column),
        active_flag_column = VALUES(active_flag_column),
        active_flag_value  = VALUES(active_flag_value),
        is_active          = VALUES(is_active),
        description        = VALUES(description),
        updated_at         = NOW()
    mapping: {}

  # ==========================================================================
  # code_table_manage: 컬럼-코드 매핑 UPSERT
  # ==========================================================================
  columnCodeMappingUpsert:
    sql: |
      INSERT INTO column_code_mapping (
        target_schema, target_table, target_column,
        code_table_name, group_code, display_name,
        include_in_prompt, is_active, description
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)
      ON DUPLICATE KEY UPDATE
        code_table_name  = VALUES(code_table_name),
        group_code       = VALUES(group_code),
        display_name     = VALUES(display_name),
        include_in_prompt = VALUES(include_in_prompt),
        is_active        = VALUES(is_active),
        description      = VALUES(description),
        updated_at       = NOW()
    mapping: {}

  # ==========================================================================
  # code_table_manage: 코드 별칭 UPSERT
  # ==========================================================================
  codeAliasUpsert:
    sql: |
      INSERT IGNORE INTO code_aliases (
        code_table_name, group_code, code_value,
        alias, locale, is_active
      ) VALUES (?, ?, ?, ?, ?, 1)
    mapping: {}

  # ==========================================================================
  # naming_convention_manage: 네이밍 컨벤션 UPSERT
  # ==========================================================================
  namingConventionUpsert:
    sql: |
      INSERT INTO naming_conventions (
        convention_name, column_pattern, target_table_pattern,
        target_column_pattern, table_prefix_strip, table_suffix_strip,
        apply_pluralization, priority, apply_to_schemas,
        exclude_tables, is_active, description
      ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 1, ?)
      ON DUPLICATE KEY UPDATE
        column_pattern       = VALUES(column_pattern),
        target_table_pattern = VALUES(target_table_pattern),
        target_column_pattern = VALUES(target_column_pattern),
        table_prefix_strip   = VALUES(table_prefix_strip),
        table_suffix_strip   = VALUES(table_suffix_strip),
        apply_pluralization  = VALUES(apply_pluralization),
        priority             = VALUES(priority),
        apply_to_schemas     = VALUES(apply_to_schemas),
        exclude_tables       = VALUES(exclude_tables),
        description          = VALUES(description),
        updated_at           = NOW()
    mapping: {}

  # ==========================================================================
  # relationship_manage: 관계 비활성화
  # ==========================================================================
  relationshipDeactivate:
    sql: |
      UPDATE table_relationships SET is_active = 0, updated_at = NOW()
      WHERE source_schema = ? AND source_table = ? AND source_column = ?
        AND target_schema = ? AND target_table = ? AND target_column = ?
    mapping: {}

  # ==========================================================================
  # auto_setup Stage 1: FK 제약조건 조회
  # ==========================================================================
  autoImportFKSelect:
    sql: |
      SELECT
        fk_tc.TABLE_SCHEMA AS source_schema,
        fk_tc.TABLE_NAME AS source_table,
        kcu.COLUMN_NAME AS source_column,
        kcu.REFERENCED_TABLE_SCHEMA AS target_schema,
        kcu.REFERENCED_TABLE_NAME AS target_table,
        kcu.REFERENCED_COLUMN_NAME AS target_column,
        CASE WHEN col.IS_NULLABLE = 'NO' THEN 'INNER' ELSE 'LEFT' END AS join_hint,
        CASE
          WHEN EXISTS (
            SELECT 1 FROM information_schema.TABLE_CONSTRAINTS uc
            JOIN information_schema.KEY_COLUMN_USAGE ukcu
              ON uc.CONSTRAINT_NAME = ukcu.CONSTRAINT_NAME
              AND uc.TABLE_SCHEMA = ukcu.TABLE_SCHEMA
            WHERE uc.CONSTRAINT_TYPE IN ('UNIQUE', 'PRIMARY KEY')
              AND uc.TABLE_SCHEMA = fk_tc.TABLE_SCHEMA
              AND uc.TABLE_NAME = fk_tc.TABLE_NAME
              AND ukcu.COLUMN_NAME = kcu.COLUMN_NAME
          ) THEN 'ONE_TO_ONE'
          ELSE 'MANY_TO_ONE'
        END AS relationship_type
      FROM information_schema.TABLE_CONSTRAINTS fk_tc
      JOIN information_schema.KEY_COLUMN_USAGE kcu
        ON fk_tc.CONSTRAINT_NAME = kcu.CONSTRAINT_NAME
        AND fk_tc.TABLE_SCHEMA = kcu.TABLE_SCHEMA
      JOIN information_schema.COLUMNS col
        ON col.TABLE_SCHEMA = fk_tc.TABLE_SCHEMA
        AND col.TABLE_NAME = fk_tc.TABLE_NAME
        AND col.COLUMN_NAME = kcu.COLUMN_NAME
      WHERE fk_tc.CONSTRAINT_TYPE = 'FOREIGN KEY'
        AND kcu.REFERENCED_TABLE_NAME IS NOT NULL
        AND fk_tc.TABLE_SCHEMA NOT IN ('information_schema', 'mysql', 'performance_schema', 'sys', 'nl2sql')
        AND kcu.REFERENCED_TABLE_SCHEMA NOT IN ('information_schema', 'mysql', 'performance_schema', 'sys', 'nl2sql')
    mapping:
      sourceSchema: source_schema
      sourceTable: source_table
      sourceColumn: source_column
      targetSchema: target_schema
      targetTable: target_table
      targetColumn: target_column
      joinHint: join_hint
      relationshipType: relationship_type

  # ==========================================================================
  # auto_setup Stage 2: 코드테이블 휴리스틱 탐지
  # ==========================================================================
  autoImportCodeTableSelect:
    sql: |
      WITH table_stats AS (
        SELECT TABLE_SCHEMA AS table_schema, TABLE_NAME AS table_name, TABLE_ROWS AS estimated_rows
        FROM information_schema.TABLES
        WHERE TABLE_SCHEMA NOT IN ('information_schema', 'mysql', 'performance_schema', 'sys', 'nl2sql')
          AND TABLE_TYPE = 'BASE TABLE'
          AND TABLE_ROWS BETWEEN 1 AND 1000
      ),
      column_analysis AS (
        SELECT ts.table_schema, ts.table_name, ts.estimated_rows,
          CASE WHEN EXISTS (SELECT 1 FROM information_schema.COLUMNS c WHERE c.TABLE_SCHEMA = ts.table_schema AND c.TABLE_NAME = ts.table_name AND (LOWER(c.COLUMN_NAME) LIKE '%code%' OR LOWER(c.COLUMN_NAME) LIKE '%cd%')) THEN 1 ELSE 0 END AS has_code_col,
          CASE WHEN EXISTS (SELECT 1 FROM information_schema.COLUMNS c WHERE c.TABLE_SCHEMA = ts.table_schema AND c.TABLE_NAME = ts.table_name AND (LOWER(c.COLUMN_NAME) LIKE '%name%' OR LOWER(c.COLUMN_NAME) LIKE '%nm%' OR LOWER(c.COLUMN_NAME) LIKE '%label%')) THEN 1 ELSE 0 END AS has_name_col,
          CASE WHEN EXISTS (SELECT 1 FROM information_schema.COLUMNS c WHERE c.TABLE_SCHEMA = ts.table_schema AND c.TABLE_NAME = ts.table_name AND (LOWER(c.COLUMN_NAME) LIKE '%group%' OR LOWER(c.COLUMN_NAME) LIKE '%type%' OR LOWER(c.COLUMN_NAME) LIKE '%category%')) THEN 1 ELSE 0 END AS has_group_col,
          CASE WHEN EXISTS (SELECT 1 FROM information_schema.COLUMNS c WHERE c.TABLE_SCHEMA = ts.table_schema AND c.TABLE_NAME = ts.table_name AND (LOWER(c.COLUMN_NAME) LIKE '%order%' OR LOWER(c.COLUMN_NAME) LIKE '%seq%' OR LOWER(c.COLUMN_NAME) LIKE '%sort%')) THEN 1 ELSE 0 END AS has_sort_col,
          CASE WHEN EXISTS (SELECT 1 FROM information_schema.COLUMNS c WHERE c.TABLE_SCHEMA = ts.table_schema AND c.TABLE_NAME = ts.table_name AND (LOWER(c.COLUMN_NAME) LIKE '%active%' OR LOWER(c.COLUMN_NAME) LIKE '%use%' OR LOWER(c.COLUMN_NAME) LIKE '%\\_yn')) THEN 1 ELSE 0 END AS has_active_col,
          CASE WHEN LOWER(ts.table_name) REGEXP '(code|cd|common|master|lookup|ref|type|status|category)' THEN 2 ELSE 0 END AS name_score,
          COALESCE((SELECT COUNT(DISTINCT tc.TABLE_NAME) FROM information_schema.TABLE_CONSTRAINTS tc JOIN information_schema.KEY_COLUMN_USAGE kcu ON tc.CONSTRAINT_NAME = kcu.CONSTRAINT_NAME AND tc.TABLE_SCHEMA = kcu.TABLE_SCHEMA WHERE tc.CONSTRAINT_TYPE = 'FOREIGN KEY' AND kcu.REFERENCED_TABLE_SCHEMA = ts.table_schema AND kcu.REFERENCED_TABLE_NAME = ts.table_name), 0) AS ref_count
        FROM table_stats ts
      ),
      code_candidates AS (
        SELECT ca.*,
          (ca.has_code_col + ca.has_name_col + ca.has_group_col + ca.has_sort_col + ca.has_active_col + ca.name_score + CASE WHEN ca.ref_count >= 2 THEN 2 ELSE 0 END) AS total_score,
          (SELECT c.COLUMN_NAME FROM information_schema.COLUMNS c WHERE c.TABLE_SCHEMA = ca.table_schema AND c.TABLE_NAME = ca.table_name AND (LOWER(c.COLUMN_NAME) LIKE '%code%' OR LOWER(c.COLUMN_NAME) LIKE '%cd%') ORDER BY c.ORDINAL_POSITION LIMIT 1) AS guessed_code_col,
          (SELECT c.COLUMN_NAME FROM information_schema.COLUMNS c WHERE c.TABLE_SCHEMA = ca.table_schema AND c.TABLE_NAME = ca.table_name AND (LOWER(c.COLUMN_NAME) LIKE '%name%' OR LOWER(c.COLUMN_NAME) LIKE '%nm%' OR LOWER(c.COLUMN_NAME) LIKE '%label%') ORDER BY c.ORDINAL_POSITION LIMIT 1) AS guessed_name_col,
          (SELECT c.COLUMN_NAME FROM information_schema.COLUMNS c WHERE c.TABLE_SCHEMA = ca.table_schema AND c.TABLE_NAME = ca.table_name AND (LOWER(c.COLUMN_NAME) LIKE '%group%' OR LOWER(c.COLUMN_NAME) LIKE '%type%' OR LOWER(c.COLUMN_NAME) LIKE '%category%') ORDER BY c.ORDINAL_POSITION LIMIT 1) AS guessed_group_col,
          (SELECT c.COLUMN_NAME FROM information_schema.COLUMNS c WHERE c.TABLE_SCHEMA = ca.table_schema AND c.TABLE_NAME = ca.table_name AND (LOWER(c.COLUMN_NAME) LIKE '%order%' OR LOWER(c.COLUMN_NAME) LIKE '%seq%' OR LOWER(c.COLUMN_NAME) LIKE '%sort%') ORDER BY c.ORDINAL_POSITION LIMIT 1) AS guessed_sort_col,
          (SELECT c.COLUMN_NAME FROM information_schema.COLUMNS c WHERE c.TABLE_SCHEMA = ca.table_schema AND c.TABLE_NAME = ca.table_name AND (LOWER(c.COLUMN_NAME) LIKE '%active%' OR LOWER(c.COLUMN_NAME) LIKE '%use%' OR LOWER(c.COLUMN_NAME) LIKE '%\\_yn') ORDER BY c.ORDINAL_POSITION LIMIT 1) AS guessed_active_col
        FROM column_analysis ca
      )
      SELECT * FROM code_candidates WHERE total_score >= 3
    mapping:
      tableSchema: table_schema
      tableName: table_name
      estimatedRows: estimated_rows
      totalScore: total_score
      guessedCodeCol: guessed_code_col
      guessedNameCol: guessed_name_col
      guessedGroupCol: guessed_group_col
      guessedSortCol: guessed_sort_col
      guessedActiveCol: guessed_active_col

  # ==========================================================================
  # auto_setup Stage 3: FK→코드테이블 매핑 탐지
  # ==========================================================================
  autoImportCodeMappingSelect:
    sql: |
      SELECT
        tr.source_schema,
        tr.source_table,
        tr.source_column,
        ct.code_table_name
      FROM table_relationships tr
      JOIN code_tables ct
        ON tr.target_schema = ct.table_schema
        AND tr.target_table = ct.table_name
      WHERE tr.created_by = 'auto_import'
        AND NOT EXISTS (
          SELECT 1 FROM column_code_mapping ccm
          WHERE ccm.target_schema = tr.source_schema
            AND ccm.target_table = tr.source_table
            AND ccm.target_column = tr.source_column
        )
    mapping:
      sourceSchema: source_schema
      sourceTable: source_table
      sourceColumn: source_column
      codeTableName: code_table_name

# ============================================================================
# DDL: 메타데이터 테이블 자동 생성 (기본 스키마)
# ============================================================================
ddl:
  tables:
    - name: table_relationships
      createSql: |
        CREATE TABLE IF NOT EXISTS table_relationships (
          id INT AUTO_INCREMENT PRIMARY KEY,
          source_schema VARCHAR(128) NOT NULL,
          source_table VARCHAR(128) NOT NULL,
          source_column VARCHAR(128) NOT NULL,
          target_schema VARCHAR(128) NOT NULL,
          target_table VARCHAR(128) NOT NULL,
          target_column VARCHAR(128) NOT NULL,
          relationship_type ENUM('ONE_TO_ONE','ONE_TO_MANY','MANY_TO_ONE','MANY_TO_MANY')
            NOT NULL DEFAULT 'MANY_TO_ONE',
          confidence_level ENUM('HIGH','MEDIUM','LOW') NOT NULL DEFAULT 'HIGH',
          join_hint ENUM('INNER','LEFT','RIGHT') DEFAULT NULL,
          polymorphic_type_column VARCHAR(128),
          polymorphic_type_value VARCHAR(128),
          description TEXT,
          business_context TEXT,
          is_active TINYINT(1) NOT NULL DEFAULT 1,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          created_by VARCHAR(100),
          updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
          updated_by VARCHAR(100),
          UNIQUE KEY uk_table_rel (source_schema, source_table, source_column,
                                   target_schema, target_table, target_column),
          INDEX idx_rel_source (source_schema, source_table),
          INDEX idx_rel_target (target_schema, target_table),
          INDEX idx_rel_active (is_active)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci

    - name: naming_conventions
      createSql: |
        CREATE TABLE IF NOT EXISTS naming_conventions (
          id INT AUTO_INCREMENT PRIMARY KEY,
          convention_name VARCHAR(100) NOT NULL UNIQUE,
          column_pattern VARCHAR(255) NOT NULL,
          target_table_pattern VARCHAR(255) NOT NULL,
          target_column_pattern VARCHAR(255) NOT NULL DEFAULT 'id',
          table_prefix_strip VARCHAR(50),
          table_suffix_strip VARCHAR(50),
          apply_pluralization TINYINT(1) DEFAULT 1,
          priority INT NOT NULL DEFAULT 100,
          apply_to_schemas JSON,
          exclude_tables JSON,
          is_active TINYINT(1) NOT NULL DEFAULT 1,
          description TEXT,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
          INDEX idx_naming_priority (priority, is_active)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci

    - name: code_tables
      createSql: |
        CREATE TABLE IF NOT EXISTS code_tables (
          id INT AUTO_INCREMENT PRIMARY KEY,
          code_table_name VARCHAR(100) NOT NULL UNIQUE,
          table_schema VARCHAR(128) NOT NULL,
          table_name VARCHAR(128) NOT NULL,
          group_code_column VARCHAR(128) NOT NULL,
          code_column VARCHAR(128) NOT NULL,
          code_name_column VARCHAR(128) NOT NULL,
          description_column VARCHAR(128),
          sort_order_column VARCHAR(128),
          active_flag_column VARCHAR(128),
          active_flag_value VARCHAR(50),
          additional_filter TEXT,
          locale_column VARCHAR(128),
          default_locale VARCHAR(10) DEFAULT 'ko',
          is_active TINYINT(1) NOT NULL DEFAULT 1,
          description TEXT,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
          UNIQUE KEY uk_code_table_loc (table_schema, table_name),
          INDEX idx_code_tables_active (is_active)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci

    - name: column_code_mapping
      createSql: |
        CREATE TABLE IF NOT EXISTS column_code_mapping (
          id INT AUTO_INCREMENT PRIMARY KEY,
          target_schema VARCHAR(128) NOT NULL,
          target_table VARCHAR(128) NOT NULL,
          target_column VARCHAR(128) NOT NULL,
          code_table_name VARCHAR(100) NOT NULL,
          group_code VARCHAR(100) NOT NULL,
          display_name VARCHAR(200),
          include_in_prompt TINYINT(1) NOT NULL DEFAULT 1,
          is_active TINYINT(1) NOT NULL DEFAULT 1,
          description TEXT,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
          UNIQUE KEY uk_col_code_mapping (target_schema, target_table, target_column),
          INDEX idx_col_mapping_table (target_schema, target_table),
          INDEX idx_col_mapping_code (code_table_name, group_code),
          CONSTRAINT fk_col_mapping_code_table
            FOREIGN KEY (code_table_name) REFERENCES code_tables(code_table_name)
            ON UPDATE CASCADE
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci

    - name: code_aliases
      createSql: |
        CREATE TABLE IF NOT EXISTS code_aliases (
          id INT AUTO_INCREMENT PRIMARY KEY,
          code_table_name VARCHAR(100) NOT NULL,
          group_code VARCHAR(100) NOT NULL,
          code_value VARCHAR(100) NOT NULL,
          alias VARCHAR(200) NOT NULL,
          locale VARCHAR(10) DEFAULT 'ko',
          is_active TINYINT(1) NOT NULL DEFAULT 1,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          UNIQUE KEY uk_code_alias (code_table_name, group_code, alias, locale),
          INDEX idx_code_alias_lookup (alias, locale),
          CONSTRAINT fk_alias_code_table
            FOREIGN KEY (code_table_name) REFERENCES code_tables(code_table_name)
            ON UPDATE CASCADE
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci

    - name: glossary_terms
      createSql: |
        CREATE TABLE IF NOT EXISTS glossary_terms (
          id INT AUTO_INCREMENT PRIMARY KEY,
          term_code VARCHAR(100) NOT NULL UNIQUE,
          term VARCHAR(200) NOT NULL,
          category ENUM('CUSTOMER','ORDER','PRODUCT','DATE','STATUS','METRIC','GENERAL'),
          sql_condition TEXT NOT NULL,
          sql_condition_pg TEXT,
          sql_condition_oracle TEXT,
          apply_to_tables JSON,
          required_columns JSON NOT NULL,
          definition TEXT NOT NULL,
          example_usage TEXT,
          example_sql TEXT,
          business_context TEXT,
          priority INT NOT NULL DEFAULT 100,
          is_active TINYINT(1) NOT NULL DEFAULT 1,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          created_by VARCHAR(100),
          updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
          updated_by VARCHAR(100),
          INDEX idx_glossary_term (term),
          INDEX idx_glossary_category (category),
          INDEX idx_glossary_active (is_active)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci

    - name: glossary_aliases
      createSql: |
        CREATE TABLE IF NOT EXISTS glossary_aliases (
          id INT AUTO_INCREMENT PRIMARY KEY,
          term_code VARCHAR(100) NOT NULL,
          alias VARCHAR(200) NOT NULL,
          locale VARCHAR(10) DEFAULT 'ko',
          match_type ENUM('EXACT','CONTAINS','STARTS_WITH','ENDS_WITH','REGEX')
            NOT NULL DEFAULT 'EXACT',
          is_active TINYINT(1) NOT NULL DEFAULT 1,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          UNIQUE KEY uk_glossary_alias (term_code, alias, locale),
          INDEX idx_glossary_alias_lookup (alias, locale),
          CONSTRAINT fk_glossary_alias_term
            FOREIGN KEY (term_code) REFERENCES glossary_terms(term_code)
            ON UPDATE CASCADE ON DELETE CASCADE
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci

    - name: glossary_contexts
      createSql: |
        CREATE TABLE IF NOT EXISTS glossary_contexts (
          id INT AUTO_INCREMENT PRIMARY KEY,
          term_code VARCHAR(100) NOT NULL,
          context_schema VARCHAR(128) NOT NULL,
          context_table VARCHAR(128) NOT NULL,
          sql_condition TEXT NOT NULL,
          sql_condition_pg TEXT,
          sql_condition_oracle TEXT,
          required_columns JSON NOT NULL,
          context_definition TEXT,
          is_active TINYINT(1) NOT NULL DEFAULT 1,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          UNIQUE KEY uk_glossary_context (term_code, context_schema, context_table),
          INDEX idx_glossary_ctx_table (context_schema, context_table),
          CONSTRAINT fk_glossary_ctx_term
            FOREIGN KEY (term_code) REFERENCES glossary_terms(term_code)
            ON UPDATE CASCADE ON DELETE CASCADE
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci

    - name: query_patterns
      createSql: |
        CREATE TABLE IF NOT EXISTS query_patterns (
          id INT AUTO_INCREMENT PRIMARY KEY,
          pattern_code VARCHAR(100) NOT NULL UNIQUE,
          pattern_name VARCHAR(200) NOT NULL,
          category ENUM('AGGREGATION','REPORT','LOOKUP','ANALYSIS','COMPARISON','TREND','RANKING','GENERAL'),
          sql_template TEXT NOT NULL,
          sql_template_pg TEXT,
          sql_template_oracle TEXT,
          applicable_tables JSON,
          required_columns JSON,
          required_joins JSON,
          match_score_threshold INT NOT NULL DEFAULT 70,
          priority INT NOT NULL DEFAULT 100,
          description TEXT NOT NULL,
          use_case TEXT,
          example_input TEXT,
          example_output TEXT,
          performance_notes TEXT,
          is_active TINYINT(1) NOT NULL DEFAULT 1,
          usage_count INT NOT NULL DEFAULT 0,
          last_used_at TIMESTAMP NULL,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
          created_by VARCHAR(100),
          updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
          updated_by VARCHAR(100),
          INDEX idx_pattern_category (category),
          INDEX idx_pattern_active (is_active),
          INDEX idx_pattern_priority (priority),
          CONSTRAINT chk_match_score CHECK (match_score_threshold BETWEEN 0 AND 100)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci

    - name: pattern_parameters
      createSql: |
        CREATE TABLE IF NOT EXISTS pattern_parameters (
          id INT AUTO_INCREMENT PRIMARY KEY,
          pattern_code VARCHAR(100) NOT NULL,
          param_name VARCHAR(100) NOT NULL,
          param_type ENUM('COLUMN','TABLE','VALUE','DATE','NUMBER','EXPRESSION','CONDITION') NOT NULL,
          is_required TINYINT(1) NOT NULL DEFAULT 1,
          default_value TEXT,
          allowed_values JSON,
          validation_pattern VARCHAR(255),
          infer_from_keywords JSON,
          infer_from_column_type VARCHAR(50),
          description TEXT,
          example_value TEXT,
          display_order INT NOT NULL DEFAULT 0,
          is_active TINYINT(1) NOT NULL DEFAULT 1,
          UNIQUE KEY uk_pattern_param (pattern_code, param_name),
          INDEX idx_pattern_params (pattern_code),
          CONSTRAINT fk_param_pattern
            FOREIGN KEY (pattern_code) REFERENCES query_patterns(pattern_code)
            ON UPDATE CASCADE ON DELETE CASCADE
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci

    - name: pattern_keywords
      createSql: |
        CREATE TABLE IF NOT EXISTS pattern_keywords (
          id INT AUTO_INCREMENT PRIMARY KEY,
          pattern_code VARCHAR(100) NOT NULL,
          keyword VARCHAR(100) NOT NULL,
          locale VARCHAR(10) DEFAULT 'ko',
          weight INT NOT NULL DEFAULT 10,
          match_type ENUM('EXACT','CONTAINS','STARTS_WITH','ENDS_WITH','REGEX')
            NOT NULL DEFAULT 'CONTAINS',
          is_required TINYINT(1) NOT NULL DEFAULT 0,
          is_active TINYINT(1) NOT NULL DEFAULT 1,
          INDEX idx_pattern_kw_lookup (keyword, locale),
          INDEX idx_pattern_kw_pattern (pattern_code),
          CONSTRAINT chk_weight CHECK (weight BETWEEN 1 AND 100),
          CONSTRAINT fk_kw_pattern
            FOREIGN KEY (pattern_code) REFERENCES query_patterns(pattern_code)
            ON UPDATE CASCADE ON DELETE CASCADE
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci

    - name: query_history
      createSql: |
        CREATE TABLE IF NOT EXISTS query_history (
          id            INT AUTO_INCREMENT PRIMARY KEY,
          query_hash    VARCHAR(64)  NOT NULL UNIQUE,
          natural_query TEXT         NOT NULL,
          generated_sql TEXT,
          connection_id VARCHAR(100),
          executed      TINYINT(1)   NOT NULL DEFAULT 0,
          usage_count   INT          NOT NULL DEFAULT 1,
          last_used_at  DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,
          created_at    DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,
          INDEX idx_qhist_usage (usage_count),
          INDEX idx_qhist_last  (last_used_at),
          INDEX idx_qhist_conn  (connection_id)
        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci
